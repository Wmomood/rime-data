customization:
  distribution_code_name: Weasel
  distribution_version: 0.17.3
  generator: "Weasel::UIStyleSettings"
  modified_time: "Sun May 25 08:02:19 2025"
  rime_version: 1.13.1
"key_binder/bindings":
  - accept: "Control+space"
    send: "Control+space"
    when: always
patch:
  global_ascii: true
  "style/color_scheme": momo
  "style/display_tray_icon": true
preset_color_schemes:
  momo:
    name: 牧／momo
    author: momo
    text_color: 0xffffff                          #默认文字颜色
    back_color: 0x2C2C2C                          #候选窗背景色
    shadow_color: 0x00000000                      #候选窗阴影色，默认全透明（无阴影）
    border_color: 0x2C2C2C                        #候选窗边框颜色
    hilited_text_color: 0xffffff                  #编码文字颜色   
    hilited_back_color: 0x383838                  #编码背景颜色
    hilited_shadow_color: 0x00000000              #编码背景块阴影颜色 
    hilited_candidate_text_color: 0xffffff        #高亮候选文字颜色
    hilited_candidate_back_color: 0x383838        #高亮候选背景颜色 
    hilited_candidate_shadow_color: 0x00000000    #高亮候选背景块阴影颜色  
    candidate_text_color: 0xF5F5F5                #非高亮候选文字颜色
    candidate_back_color: 0x2C2C2C                #非高亮候选背景颜色 
    candidate_shadow_color: 0x00000000            #非高亮候选背景块阴影颜色
    comment_text_color: '0xB5B5B5'